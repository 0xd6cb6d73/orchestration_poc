services:
  app:
    build: .
    init: true
    restart: unless-stopped
    environment:
      PHOENIX_ENABLED: "1"
      PHOENIX_OTLP_HTTP_ENDPOINT: http://phoenix:6006/v1/traces
      POC_DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - app_data:/data
    depends_on:
      - phoenix
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  phoenix:
    image: arizephoenix/phoenix:version-14.0.0
    restart: unless-stopped
    environment:
      PHOENIX_WORKING_DIR: /mnt/data
      PHOENIX_ALLOW_EXTERNAL_RESOURCES: "false"
    ports:
      - "6006:6006"
      - "4317:4317"
    volumes:
      - phoenix_data:/mnt/data

volumes:
  app_data:
  phoenix_data:
